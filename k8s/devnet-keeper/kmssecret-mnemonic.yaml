# KMSSecret: sync the devnet BIP-39 mnemonic from lux KMS into a k8s secret the
# dexkeeper reads as LUX_MNEMONIC. This is the SANCTIONED key path — the operator's
# kms-operator reconciles it; no plaintext mnemonic is ever committed or handled
# out-of-band. The keeper derives the maker key (0x9011…, path m/44'/9000'/0'/0/i) in
# its own process heap from this env and zeroes it on exit — the same trust model as
# luxd's KMS-synced staking keys.
#
# Auth + scope mirror the PROVEN luxd-staking-kms-sync (which already pulls devnet
# staking material from this exact KMS project/env): universalAuth via the
# universal-auth-credentials machine identity in lux-system, against the in-cluster
# kms.lux-kms-go service, project lux-infra / env devnet.
#
# The mnemonic key name + path: the canonical genesis loader
# (genesis/cmd/createchaintx loadMnemonic) reads key "mnemonic" under the staking
# secret path. luxd-staking-kms-sync uses secretsScope path "/staking"; the mnemonic
# is the "mnemonic" key at that scope. If the deployment stored it under the
# Infisical-style path "/lux/devnet/staking" instead, change secretsPath accordingly
# (verify against the KMS once with the operator's credentials — do NOT hardcode a
# guess that silently syncs nothing).
apiVersion: secrets.lux.network/v1alpha1
kind: KMSSecret
metadata:
  name: dexkeeper-mnemonic-kms-sync
  namespace: lux-devnet
spec:
  hostAPI: http://kms.lux-kms-go.svc.cluster.local
  resyncInterval: 300
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: lux-system
      secretsScope:
        projectSlug: lux-infra
        envSlug: devnet
        secretsPath: /staking
  managedKubeSecretReferences:
    - secretName: dexkeeper-mnemonic
      secretNamespace: lux-devnet
      creationPolicy: Owner
      secretType: Opaque
      template:
        # Project ONLY the mnemonic into LUX_MNEMONIC — not the staking keys also at
        # this scope. {{.mnemonic}} is the KMS secret key "mnemonic".
        data:
          LUX_MNEMONIC: "{{.mnemonic}}"
