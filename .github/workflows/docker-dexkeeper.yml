name: Docker dexkeeper

# Self-contained image build for ghcr.io/luxfi/dexkeeper on the lux-build ARC
# pool. Deliberately INLINE (not the hanzoai/.github reusable workflow): luxfi/*
# repos cannot resolve the cross-org reusable `docker-build.yml@main` (GitHub
# "workflow was not found" at validation — the reason docker.yml fails at 0s).
# This mirrors luxfi/node's proven inline Docker workflow exactly.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'cmd/dexkeeper/**'
      - 'Dockerfile.dexkeeper'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-dexkeeper.yml'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-amd64:
    # In-cluster ARC pool (lux-build autoscalingrunnerset in lux-k8s, amd64
    # DOKS nodes, DinD sidecar) — same pool luxfi/node builds on.
    runs-on: lux-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luxfi/dexkeeper
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Resolve cross-repo PAT for private luxfi/* deps
        id: pat
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          UNIVERSE_PAT: ${{ secrets.UNIVERSE_PAT }}
        run: |
          tok="$GH_TOKEN"
          src="GH_TOKEN"
          if [ -z "$tok" ]; then
            tok="$UNIVERSE_PAT"
            src="UNIVERSE_PAT"
          fi
          if [ -z "$tok" ]; then
            echo "::error::Neither GH_TOKEN (org) nor UNIVERSE_PAT (repo) is set. Private luxfi/* deps cannot be resolved."
            exit 1
          fi
          echo "Using secret: $src (length=${#tok})"
          echo "::add-mask::$tok"
          echo "token<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tok" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build & push dexkeeper (amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dexkeeper
          platforms: linux/amd64
          push: true
          # The Dockerfile resolves private luxfi/* modules via git url.insteadOf,
          # taking the token from the BuildKit secret id=ghtok (node's convention).
          secrets: |
            ghtok=${{ steps.pat.outputs.token }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=ghcr.io/luxfi/dexkeeper:buildcache-amd64
          cache-to: type=registry,ref=ghcr.io/luxfi/dexkeeper:buildcache-amd64,mode=max
