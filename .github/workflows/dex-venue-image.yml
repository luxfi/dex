# Build + push the D-Chain VENUE image (dex family) — ghcr.io/luxfi/dex-venue.
#
# This is the missing artifact that blocks D-Chain turn-on: the dchain-tagged
# luxd + the dexd GPU matching engine in one image (see Dockerfile.dvenue).
# The public ghcr.io/luxfi/node image does NOT carry the DexVM; this private
# build does.
#
# ARCH: linux/arm64 ONLY. The matcher links the CUDA kernels (no non-CUDA
# `cgo && linux` fallback), and the bundled GPU deps are published arm64-only by
# luxcpp/dex dex-gpu-release (spark / GB10 is the fleet's one CUDA host, aarch64).
# Building the image does NOT require a live GPU — it links against the CUDA
# devel base image's libcudart — so it runs on any self-hosted arm64 arcd runner.
#
# PREREQUISITE: luxcpp/dex dex-gpu-release must have published
#   luxdex-venue-<VENUE_DEPS_VERSION>-linux-arm64.tar.gz
# first, or the Dockerfile's dep fetch 404s. See Dockerfile.dvenue.
name: dex-venue-image

on:
  workflow_dispatch:
    inputs:
      venue_deps_version:
        description: 'luxcpp/dex venue GPU deps release tag to bundle'
        required: false
        default: v0.1.1
      node_version:
        description: 'luxfi/node tag to build the dchain-tagged luxd from'
        required: false
        default: v1.30.12
  push:
    # Dedicated venue tag prefix so this does NOT fire on the dex repo's own
    # `v*` SDK/release tags (separate concern, separate cadence). Cut a venue
    # image with e.g. `git tag venue-v0.1.0 && git push origin venue-v0.1.0`.
    tags: ['venue-v*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-arm64:
    # Canonical arm64 arcd label. Lands on spark or dbc-colima; the build only
    # needs the CUDA devel BASE IMAGE (libcudart to link), not a live GPU.
    runs-on: [self-hosted, linux, arm64]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luxfi/dex-venue
          # Semver-only published tags + an immutable sha tag for traceability.
          # No floating :latest (matches node/docker.yml policy; K8s image
          # caching makes :latest unsafe for the operator overlays).
          flavor: |
            latest=false
          tags: |
            type=match,pattern=venue-(v.*),group=1
            type=sha,format=short,prefix=sha-

      - name: Resolve cross-repo PAT for private luxfi/* deps
        id: pat
        env:
          # The dexd build pulls private luxfi/* modules and the private
          # luxcpp/dex release tarball; the default GITHUB_TOKEN is repo-scoped.
          # Prefer org GH_TOKEN, fall back to repo UNIVERSE_PAT (same order as
          # node/docker.yml).
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          UNIVERSE_PAT: ${{ secrets.UNIVERSE_PAT }}
        run: |
          tok="$GH_TOKEN"; src="GH_TOKEN"
          if [ -z "$tok" ]; then tok="$UNIVERSE_PAT"; src="UNIVERSE_PAT"; fi
          if [ -z "$tok" ]; then
            echo "::error::Neither GH_TOKEN (org) nor UNIVERSE_PAT (repo) is set. Private luxfi/* deps + the luxcpp/dex venue tarball cannot be resolved."
            exit 1
          fi
          echo "Using secret: $src (length=${#tok})"
          echo "::add-mask::$tok"
          echo "token<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tok" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build & push (arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dvenue
          platforms: linux/arm64
          push: true
          build-args: |
            VENUE_DEPS_VERSION=${{ github.event.inputs.venue_deps_version || 'v0.1.1' }}
            NODE_VERSION=${{ github.event.inputs.node_version || 'v1.30.12' }}
          # url.insteadOf + the release-tarball Authorization header both read
          # this BuildKit secret (see Dockerfile.dvenue).
          secrets: |
            ghtok=${{ steps.pat.outputs.token }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=registry,ref=ghcr.io/luxfi/dex-venue:buildcache-arm64
          cache-to: type=registry,ref=ghcr.io/luxfi/dex-venue:buildcache-arm64,mode=max
