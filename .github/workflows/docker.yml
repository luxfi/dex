name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main, dev, test]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/luxfi/dex
            dockerfile: Dockerfile
          - image: ghcr.io/luxfi/dex-gateway
            dockerfile: Dockerfile.gateway
          - image: ghcr.io/luxfi/dexkeeper
            dockerfile: Dockerfile.dexkeeper
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      runner-amd64: luxfi-amd64
      runner-arm64: luxfi-arm64
      runner-deploy: lux-deploy-linux-amd64
    secrets: inherit
