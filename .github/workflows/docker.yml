name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main, dev, test]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/luxfi/dex
            dockerfile: Dockerfile
          - image: ghcr.io/luxfi/dex-gateway
            dockerfile: Dockerfile.gateway
          - image: ghcr.io/luxfi/dexkeeper
            dockerfile: Dockerfile.dexkeeper
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      # runner-* inputs are JSON-array strings decoded via fromJson() in the
      # reusable workflow. The prior bare-string overrides ("luxfi-amd64", …)
      # made fromJson() fail -> 0s "workflow file issue" (broken since 2026-06-19).
      # The lux arcd pool registers on the canonical [self-hosted,linux,<arch>]
      # labels (same as node's lux-build); org runner-group + arcd repo allowlist
      # provide isolation on the shared labels, so the defaults are correct here.
    secrets: inherit
