name: SDK CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go SDK Tests
  test-go:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/lx-trading-go

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: sdk/lx-trading-go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: sdk/lx-trading-go/coverage.out
          flags: go-sdk
          fail_ci_if_error: false

      - name: Build
        run: go build ./...

  # TypeScript SDK Tests
  test-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/lx-trading-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/lx-trading-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm test

  # Python SDK Tests
  test-python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/lx-trading-py

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-asyncio pytest-cov
          uv pip install --system aiohttp websockets ccxt pydantic

      - name: Run tests with coverage
        env:
          PYTHONPATH: ./python
        run: |
          pytest tests/ -v --cov=lx_trading --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: sdk/lx-trading-py/coverage.xml
          flags: python-sdk
          fail_ci_if_error: false

  # Rust SDK Tests
  test-rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/lx-trading-core

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/lx-trading-core

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build release
        run: cargo build --release

  # C++ SDK Tests
  test-cpp:
    name: C++ SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/lx-trading-cpp

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libcurl4-openssl-dev

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DLX_TRADING_BUILD_TESTS=ON

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ./lx_trading_tests

  # Integration test (all SDKs must pass)
  integration-check:
    name: Integration Check
    needs: [test-go, test-typescript, test-python, test-rust, test-cpp]
    runs-on: ubuntu-latest
    steps:
      - name: All SDK tests passed
        run: echo "All SDK tests passed successfully!"

  # Notify on failure
  notify-failure:
    name: Notify on Failure
    needs: [test-go, test-typescript, test-python, test-rust, test-cpp]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Report failure
        run: |
          echo "One or more SDK tests failed!"
          exit 1
