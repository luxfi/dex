name: SDK CI

# The four language SDKs under sdk/, on the native runners
# (git.hanzo.ai -> git-runner).
#
# This replaces .github/workflows/sdk-ci.yml, which had never run at all. Two
# independent reasons:
#
#   * every job named `runs-on: lux-build-amd64`. No runner on this forge
#     carries that label -- the pools are `lux-build-linux-<arch>` -- and a job
#     naming a label nothing carries does not fail, it waits.
#
#   * `notify-failure` declared `needs: [..., test-cpp]` and there is no
#     test-cpp job in the file. A dangling `needs` is a validation error, and it
#     rejects the WHOLE workflow, not just that job. notify-failure only echoed
#     a failure message anyway, so it is dropped rather than given a job to
#     depend on.
#
# The codecov uploads go too: they need CODECOV_TOKEN, a GitHub-Actions-era org
# secret not provisioned here. Coverage is still measured by each SDK's own test
# command.

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - 'sdk/**'
      - '.hanzo/workflows/sdk-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdk/**'

# A newer commit makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go SDK Tests
  test-go:
    name: Go SDK
    runs-on: [lux-build-linux-amd64]
    defaults:
      run:
        working-directory: sdk/lx-trading-go

    steps:
      - uses: actions/checkout@v4

      # go-version-file, not a pinned version: this pin was older than the go
      # directive in go.mod, and the job image sets GOTOOLCHAIN=local — so the
      # build refuses before compiling:
      #   go: go.mod requires go >= X (running go Y; GOTOOLCHAIN=local)
      # Reading the version from go.mod keeps the two from drifting again.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: sdk/lx-trading-go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Build
        run: go build ./...

  # TypeScript SDK Tests
  test-typescript:
    name: TypeScript SDK
    runs-on: [lux-build-linux-amd64]
    defaults:
      run:
        working-directory: sdk/lx-trading-ts

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/lx-trading-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm test

  # Python SDK Tests
  test-python:
    name: Python SDK
    runs-on: [lux-build-linux-amd64]
    defaults:
      run:
        working-directory: sdk/lx-trading-py

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-asyncio pytest-cov
          uv pip install --system aiohttp websockets ccxt pydantic

      - name: Run tests with coverage
        env:
          PYTHONPATH: ./python
        run: |
          pytest tests/ -v --cov=lx_trading --cov-report=xml

  # Rust SDK Tests
  test-rust:
    name: Rust SDK
    runs-on: [lux-build-linux-amd64]
    defaults:
      run:
        working-directory: sdk/lx-trading-core

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/lx-trading-core

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build release
        run: cargo build --release

  # Integration test (all SDKs must pass)
  integration-check:
    name: Integration Check
    needs: [test-go, test-typescript, test-python, test-rust]
    runs-on: [lux-build-linux-amd64]
    steps:
      - name: All SDK tests passed
        run: echo "All SDK tests passed successfully!"

  # Notify on failure
