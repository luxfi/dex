name: Release

# Builds ghcr.io/luxfi/dex — the CPU dexd venue, CGO_ENABLED=0 pure-Go matcher,
# ./Dockerfile — on the native runners (git.hanzo.ai → git-runner).
#
# This replaces .github/workflows/docker.yml, which ran on `runs-on: lux-build`.
# That was an ARC autoscaling runner set that no longer exists: the cluster has
# no ARC CRDs, no ARC namespace and no such pool, so every tag queued a job
# nothing could pick up, and an unclaimable job does not fail — it waits.
#
# The workflow was already self-contained rather than calling
# hanzoai/.github/.github/workflows/docker-build.yml@main, and its own comment
# records why: that shared reusable "has been failing to resolve org-wide (422
# error parsing called workflow)". That stays inlined here for the same reason.
#
# ghcr auth had to change. The old login used `github.repository_owner` with the
# instance GITHUB_TOKEN, which on this forge is a Hanzo Git token with no rights
# at ghcr.io. GHCR_USER / GHCR_TOKEN are org Actions secrets sourced from KMS.
#
# Semver-only: v* tags publish, and every run also gets sha-<sha7>. No floating
# tags — no :latest, no :main.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A release is not made irrelevant by a newer one — let it finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [lux-build-linux-amd64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            network=host

      # ghcr.io intermittently rejects a good credential:
      # `Get "https://ghcr.io/v2/": denied: denied`. Measured on the forge over 7
      # days, luxfi ran 365 logins with the same org secret and 27 failed — 7.4%
      # — across 23 repos and a dozen runners, with the same secret succeeding
      # either side of every burst. Not an expired token, not a sick runner, and
      # no correlation with concurrency (7.4% at one login per minute, 0% at
      # four).
      #
      # docker/login-action does not retry, and the job dies before the build, so
      # each occurrence costs a release silently — a tag with no image and no
      # failed push to show for it. This repo lost BOTH v1.14.15 and v1.14.16
      # that way; published stops at v1.14.14 while the newest tag is v1.14.16.
      #
      # --password-stdin, so the token is never an argument and never lands in a
      # process list or a log.
      - name: Log in to ghcr.io
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            if printf %s "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin; then
              exit 0
            fi
            echo "ghcr.io login attempt $i failed; retrying in $((i * 5))s"
            sleep $((i * 5))
          done
          echo "::error::ghcr.io refused the credential on 5 attempts over 75s — this is no longer the intermittent failure this retry covers"
          exit 1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/luxfi/dex
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Write the private-module token for BuildKit
        # The Dockerfile mounts secret id=gh_token and interpolates it into a
        # git url.insteadOf, so trailing whitespace truncates the URL there and
        # git resolves the credential prefix as the host ("Could not resolve
        # host: x-access-token"). luxfi/node hit exactly this. GH_TOKEN is the
        # org secret; UNIVERSE_PAT is the per-repo fallback.
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          UNIVERSE_PAT: ${{ secrets.UNIVERSE_PAT }}
          # Measured on this forge: repos/luxfi/dex has no secrets at all and
          # orgs/luxfi holds exactly GHCR_USER + GHCR_TOKEN. So GH_TOKEN and
          # UNIVERSE_PAT are both "" here and the step below always exits 1.
          # GHCR_TOKEN has to be a real GitHub PAT for ghcr.io to accept it, so it
          # resolves private modules too.
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          tok="${GH_TOKEN:-}"; src=GH_TOKEN
          if [ -z "$tok" ]; then tok="${UNIVERSE_PAT:-}"; src=UNIVERSE_PAT; fi
          if [ -z "$tok" ]; then tok="${GHCR_TOKEN:-}"; src=GHCR_TOKEN; fi
          if [ -z "$tok" ]; then
            echo "::error::None of GH_TOKEN, UNIVERSE_PAT or GHCR_TOKEN is set — private luxfi/* and hanzos3 deps cannot be resolved."
            exit 1
          fi
          echo "::add-mask::$tok"
          echo "using secret: $src"
          printf '%s' "$tok" | tr -d '\r\n' > "${RUNNER_TEMP}/gh_token"

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CGO_ENABLED=0
          secrets: |
            gh_token=${{ runner.temp }}/gh_token
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # ignore-error: the cache image does not exist until the first build has
          # published it, and without this buildx treats that 404 as fatal --
          #   failed to configure registry cache importer:
          #   ghcr.io/luxfi/dex:buildcache-amd64: not found
          # so a cold cache failed the build instead of simply being cold.
          cache-from: type=registry,ref=ghcr.io/luxfi/dex:buildcache-amd64,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/luxfi/dex:buildcache-amd64,mode=max,ignore-error=true