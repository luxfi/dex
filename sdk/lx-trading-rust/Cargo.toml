[package]
name = "lx-trading"
version = "0.1.0"
edition = "2021"
authors = ["Lux Network <dev@lux.network>"]
description = "High-performance trading SDK for LX DEX - financial mathematics, risk management, and orderbook utilities"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luxfi/dex"
documentation = "https://docs.lux.network/dex/sdk/rust/trading"
keywords = ["trading", "finance", "orderbook", "risk", "options"]
categories = ["finance", "mathematics"]
readme = "README.md"

[lib]
name = "lx_trading"
path = "src/lib.rs"

[dependencies]
# Error handling
thiserror = "2"

[dev-dependencies]
# None needed - using stdlib testing

[features]
default = []
simd = []  # Future SIMD optimizations
