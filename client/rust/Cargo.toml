[package]
name = "lx-cli"
version = "0.1.0"
edition = "2021"
description = "LX CLI Client"
license = "MIT"
repository = "https://github.com/luxfi/dex"

[[bin]]
name = "lx-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tungstenite = { version = "0.21", features = ["native-tls"] }
url = "2.5"
uuid = { version = "1.6", features = ["v4"] }
anyhow = "1.0"
